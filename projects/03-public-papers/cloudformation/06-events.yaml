Outputs:

  # ---------------------------------------------------------------------------
  # EventBridge
  # 07-analytics.yaml imports RetailEventBusArn to attach Glue trigger rules.
  # ECS tasks and Lambda functions import RetailEventBusName for PutEvents calls.
  # ---------------------------------------------------------------------------
  RetailEventBusArn:
    Description: >
      ARN of the retail custom EventBridge bus. ECS tasks and Lambda functions
      use this in PutEvents API calls to publish domain events.
    Value: !GetAtt RetailEventBus.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RetailEventBusArn'

  RetailEventBusName:
    Description: >
      Name of the retail EventBridge bus. Use in aws events put-events --event-bus-name
      and as the EventBusName in SDK PutEventsRequestEntry objects.
    Value: !Ref RetailEventBus
    Export:
      Name: !Sub '${AWS::StackName}-RetailEventBusName'

  RetailEventBusArchiveArn:
    Description: >
      ARN of the EventBridge archive. Use with start-replay to replay historical
      retail events to the bus (for testing new consumers, backfilling, recovery).
    Value: !GetAtt RetailEventBusArchive.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RetailEventBusArchiveArn'

