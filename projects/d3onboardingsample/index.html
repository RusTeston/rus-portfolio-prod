<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Unavailable | Rus Teston</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(160deg, #0C1A3A 0%, #0A3050 50%, #0E3558 100%);
      background-attachment: fixed;
      color: #E8F4FD;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #112347;
      border: 1px solid #1E3A5C;
      border-radius: 16px;
      padding: 56px 48px;
      max-width: 520px;
      width: 92%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .icon { font-size: 48px; margin-bottom: 24px; }
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #E0FF4F;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }
    p {
      font-size: 15px;
      color: #7FA8C9;
      line-height: 1.75;
      margin-bottom: 12px;
    }
    p:last-of-type { margin-bottom: 32px; }
    a.btn {
      display: inline-block;
      background: #E0FF4F;
      color: #0C1A3A;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 200ms;
    }
    a.btn:hover { opacity: 0.88; }
    .back {
      display: block;
      margin-top: 20px;
      font-size: 13px;
      color: #4A7299;
      text-decoration: none;
      transition: color 200ms;
    }
    .back:hover { color: #E0FF4F; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚧</div>
    <h1>Page Temporarily Unavailable</h1>
    <p>This page has been temporarily removed and is not currently available for viewing.</p>
    <p>If you would like this page reinstated or have any questions, please reach out to Rus Teston directly.</p>
    <a href="https://rus-teston.com" class="btn">← Back to Portfolio</a>
    <a href="https://www.linkedin.com/in/rusteston" class="back" target="_blank">Contact Rus on LinkedIn</a>
  </div>
</body>
</html>
